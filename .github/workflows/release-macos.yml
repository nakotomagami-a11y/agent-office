name: macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/web/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clean stale bundle output
        # The cache above falls back to a same-OS restore-key when the exact
        # Cargo.lock hash misses (every release bumps the lock file), which
        # restores the WHOLE target/ dir — including release/bundle/ from a
        # previous tag's build. The upload step below globs
        # target/release/bundle/**/*.dmg|*.app.tar.gz, so leftover
        # prior-version installers get shipped alongside the current
        # release's. Only wipe the bundle output — keep target/release/deps
        # etc. so compiled dependencies still get reused from cache.
        run: rm -rf apps/web/src-tauri/target/release/bundle

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (standalone)
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          unset __NEXT_PRIVATE_STANDALONE_CONFIG
          pnpm exec next build --webpack

      - name: Prepare Tauri bundle
        working-directory: apps/web
        run: node scripts/prepare-bundle.mjs

      - name: Build Tauri app (macOS)
        working-directory: apps/web
        env:
          # Sign the updater artifacts so the in-app updater will accept them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # DMG for manual install + .app.tar.gz + .sig for the in-app updater.
          # See docs/AUTO_UPDATE.md for the updater manifest format.
          files: |
            apps/web/src-tauri/target/release/bundle/dmg/*.dmg
            apps/web/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/web/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifact (manual run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: macos-installer
          path: |
            apps/web/src-tauri/target/release/bundle/dmg/*.dmg
            apps/web/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/web/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
