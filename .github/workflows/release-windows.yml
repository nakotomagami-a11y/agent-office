name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Redirect the pnpm content store into the workspace for ALL steps.
      # Next.js reads this to populate webpack snapshot.managedPaths; if it
      # points to C:\Users\runneradmin\... webpack recursively scans the user
      # profile and hits NTFS junctions / WindowsApps aliases → EPERM/EACCES.
      npm_config_store_dir: ${{ github.workspace }}\.pnpm-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/web/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clean stale bundle output
        # The cache above falls back to a same-OS restore-key when the exact
        # Cargo.lock hash misses (every release bumps the lock file), which
        # restores the WHOLE target/ dir — including release/bundle/ from a
        # previous tag's build. The upload step below globs
        # target/release/bundle/**/*.exe|*.msi, so leftover prior-version
        # installers get shipped alongside the current release's (this
        # shipped an 0.1.14 .exe/.msi inside the v0.1.18 release). Only wipe
        # the bundle output — keep target/release/deps etc. so compiled
        # dependencies still get reused from cache.
        shell: pwsh
        run: Remove-Item -Recurse -Force apps/web/src-tauri/target/release/bundle -ErrorAction SilentlyContinue

      - name: Install pnpm dependencies
        # Use copy mode so pnpm never creates NTFS junctions into the global
        # store (C:\Users\runneradmin\...). Junctions look like plain dirs to
        # Node.js, so webpack follows them into the user profile and hits
        # untraversable junction points (e.g. "Application Data") → EPERM.
        shell: pwsh
        env:
          npm_config_package_import_method: copy
          npm_config_store_dir: ${{ github.workspace }}\.pnpm-store
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (standalone)
        working-directory: apps/web
        shell: pwsh
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          Remove-Item Env:__NEXT_PRIVATE_STANDALONE_CONFIG -ErrorAction SilentlyContinue
          # Patch fs.readdir before next starts so NTFS junction EPERM errors
          # (C:\Users\runneradmin\Application Data) are treated as empty dirs.
          $env:NODE_OPTIONS = "--require $env:GITHUB_WORKSPACE\apps\web\scripts\patch-fs-eperm.cjs"
          pnpm exec next build --webpack

      - name: Prepare Tauri bundle
        working-directory: apps/web
        shell: pwsh
        run: node scripts/prepare-bundle.mjs

      - name: Build Tauri app (Windows)
        working-directory: apps/web
        env:
          # Sign the updater artifacts so the in-app updater will accept them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri.conf.json beforeBuildCommand re-runs `next build`. Apply the
          # same EPERM patch as the explicit build step so webpack doesn't crash
          # scanning .next/standalone NTFS junctions on the second pass.
          NODE_OPTIONS: "--require ${{ github.workspace }}/apps/web/scripts/patch-fs-eperm.cjs"
        run: pnpm tauri build

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # NSIS is the updater target on Windows; the -setup.exe.sig feeds
          # latest.json. MSI stays for manual installs. See docs/AUTO_UPDATE.md.
          files: |
            apps/web/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/web/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/web/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifact (manual run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: windows-installer
          path: |
            apps/web/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/web/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
