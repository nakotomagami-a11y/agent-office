# Typecheck, lint and test on every PR. Until this existed nothing ran the
# checks automatically, which is how a broken shell command and 47 unresolvable
# skill references stayed invisible for months.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint --max-warnings=-1

      - name: Test (domain)
        run: pnpm --filter @agent-office/domain test

      # apps/web had test files and no `test` script, so nothing ran them.
      - name: Test (web)
        run: pnpm --filter @agent-office/web test

      - name: Comment-ratio ratchet
        run: node scripts/check-comment-ratio.mjs

      # Last because it is the slowest — but it is the ONLY step that catches
      # bundle-time failures. `REPO_SCRIPTS_DIR` shipped a `new URL(<specifier>,
      # import.meta.url)` that the bundler resolves as a module; it broke every
      # route on main while typecheck, lint and all tests passed (#140).
      # `--webpack`, because that is what the AppImage ships. Next 16 defaults
      # `next build` to Turbopack, so plain `pnpm build` gates a bundler no
      # user ever runs — and the fold behaviour differs per bundler.
      - name: Build
        run: pnpm --filter @agent-office/web build:release

      # Building proves the code bundles; it does NOT prove the packaged app
      # has the files it spawns at runtime. The permission bridge was absent
      # from every shipped build while this job was green (#148).
      - name: Verify packaged bundle
        run: |
          node apps/web/scripts/prepare-bundle.mjs
          node apps/web/scripts/verify-bundle.mjs
