modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Client-only: the main class is @Mod(dist = CLIENT) and the mod registers no network channels, so you
# can join any server with it and your chats never reach a server; it only talks to Agent Office on this
# PC. The Agent Tablet item exists only in singleplayer / LAN worlds (their integrated server is this jar).
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
