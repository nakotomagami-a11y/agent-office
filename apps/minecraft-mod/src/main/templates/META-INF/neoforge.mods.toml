modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Both sides: agent bodies are real entities (with inventories) that the world saves, so the server that
# runs the world needs this jar: singleplayer / LAN always have it (their integrated server is this jar),
# a dedicated server needs it installed. Chats still only reach Agent Office on the player's own PC.
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# With Curios, an agent's inventory has the same extra slots as the player's (rings, back, charms …).
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.5.1,)"
    ordering="NONE"
    side="BOTH"
