plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// In-world tests (GameTests): part of the mod in dev runs, never in the jar. `gradlew runGameTestServer` runs them.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    // Curios: the inventory-extension API modpacks use (agent bodies mirror the player's slots).
    maven { url = "https://maven.theillusivec4.top/" }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // Skip the menus once the dev world exists (create it once from the title screen).
            if (file("run/saves/${dev_world}").exists() && !project.hasProperty('aoOpen')) {
                programArguments.addAll '--quickPlaySingleplayer', dev_world
            }
            systemProperty 'agentoffice.dev.world', dev_world
            // Scripted checks: -PaoName=value reaches DevHooks as agentoffice.dev.name, which owns every default.
            //   -PaoOpen=office|chat:project:instance:agent|tablet|...  what to open (DevHooks lists every form)
            //   -PaoQuit=true  quit after the screenshot
            //   -PaoScroll=N  wheel notches up before the screenshot; -PaoScrollDown=M then M back down
            //   -PaoPress=Label  press the first button with that label before the shot (read-only client: nothing changes)
            //   -PaoShotAfter=N  ticks before the screenshot (the press comes 40 earlier): slow loads, e.g. a PR through gh
            //   -PaoServer=localhost  join a server (runServer) instead of the dev world; a second player at once:
            //       -PaoUser=Dev2 -PaoGameDir=run-client2
            //   -PaoWorking=true  every agent works; -PaoLectern=dx,dz  a bound lectern there
            //   -PaoCommands="time set 9500;summon zombie ~8 ~ ~"  after the action; -PaoWatch=true  log agents every 2 s
            ['open', 'quit', 'scroll', 'scrollDown', 'press', 'shotAfter', 'server', 'working', 'lectern', 'commands', 'watch'].each { name ->
                def value = project.findProperty('ao' + name.capitalize())
                if (value != null) systemProperty "agentoffice.dev.${name}", value.toString()
            }
            if (project.hasProperty('aoUser')) programArguments.addAll '--username', project.findProperty('aoUser').toString()
            if (project.hasProperty('aoGameDir')) gameDirectory = file(project.findProperty('aoGameDir'))
        }
        // A dedicated server in run-server/ (accept the EULA in run-server/eula.txt once).
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        // Runs every GameTest in src/gametest, then exits: non-zero if one failed.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    addModdingDependenciesTo(sourceSets.gametest)

    // Tests run with the game loaded, so they can use its classes (codecs, items); a test that needs a world asks
    // for a throwaway server (testframework's EphemeralTestServerProvider).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    // Optional in game (declared in neoforge.mods.toml); -PaoNoCurios runs the dev client without it.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    if (!project.hasProperty('aoNoCurios')) runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${neo_version}"
    // core/ uses Gson + slf4j; pinned here so core's tests don't lean on the game's copies.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The game-loaded runner starts tests elsewhere; ArchitectureTest reads this module's sources.
    systemProperty 'agentoffice.moduleDir', projectDir.absolutePath
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Every GameTest run starts from a fresh world, as in CI.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
